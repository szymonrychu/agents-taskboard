[project]
name = "agents-taskboard"
version = "0.1.0"
description = "Tasks, decisions, todo, comments and history for users and agents"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_taskboard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
