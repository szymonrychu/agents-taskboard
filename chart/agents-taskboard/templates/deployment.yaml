{{- $tag := default .Chart.AppVersion .Values.image.tag }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- /* The notifier is a singleton (advisory lock): one replica, never two pods at once. */ -}}
{{- $components := list "web" "service" "notifier" }}
{{- if include "agents-taskboard.delegateEnabled" . }}{{ $components = append $components "delegate" }}{{ end }}
{{- range $component := $components }}
{{- $cfg := index $.Values.components $component }}
{{- $labels := dict "context" $ "component" $component }}
{{- $args := dict "web" "serve-web" "service" "serve-service" "delegate" "serve-delegate" "notifier" "notifier" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-taskboard.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-taskboard.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "notifier" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ $cfg.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agents-taskboard.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-taskboard.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-taskboard.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "agents-taskboard.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["taskboard"]
          args: ["migrate"]
          {{- include "agents-taskboard.env" (dict "ctx" $ "component" "migrate") | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["taskboard"]
          args: [{{ index $args $component | quote }}]
          {{- include "agents-taskboard.env" (dict "ctx" $ "component" $component) | nindent 10 }}
          {{- if ne $component "notifier" }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $cfg.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $cfg.port }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
