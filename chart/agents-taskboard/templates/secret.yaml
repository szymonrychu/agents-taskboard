{{- $own := dict }}
{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}{{ $_ := set $own "database-uri" .Values.postgres.url }}{{ end }}
{{- if and .Values.orchestrator.token (not .Values.orchestrator.existingSecret) }}{{ $_ := set $own "orchestrator-token" .Values.orchestrator.token }}{{ end }}
{{- if and .Values.relayToken (not .Values.relayExistingSecret) }}{{ $_ := set $own "relay-token" .Values.relayToken }}{{ end }}
{{- if and .Values.delegateTokens (not .Values.delegateExistingSecret) }}{{ $_ := set $own "delegate-tokens" .Values.delegateTokens }}{{ end }}
{{- if $own }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-taskboard.fullname" . }}
  labels:
    {{- include "agents-taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $own }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
