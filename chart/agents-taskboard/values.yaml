image:
  repository: harbor.szymonrichert.pl/containers/agents-taskboard
  # Defaults to the chart appVersion (the short sha CI sets when it packages the chart).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Required: the base URL of agents-web, e.g. https://lab.szymonrichert.pl. Notices link to
# <publicUrl>/tasks/<key>.
publicUrl: ""

# Postgres is required; there is no in-chart database (agents-helmfile deploys it).
# Set exactly one of url and existingSecret; existingSecretKey names the key holding the DSN.
postgres:
  url: ""
  existingSecret: ""
  existingSecretKey: uri

# The orchestrator the notifier messages sessions through. url is required; set exactly one of
# token and existingSecret.
orchestrator:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: token

# Bearer token of the service listener (the orchestrator relay sends it). Set exactly one of
# relayToken and relayExistingSecret.
relayToken: ""
relayExistingSecret: ""
relayExistingSecretKey: token

# Optional bearer token list of the delegate listener (cluster-only, acts as a user; the
# agents-app-connector relays to it). Comma separated, each token different from the relay token.
# Set exactly one of delegateTokens and delegateExistingSecret to render the delegate component;
# set neither and it is absent.
delegateTokens: ""
delegateExistingSecret: ""
delegateExistingSecretKey: tokens

# Optional bearer token list of the mindmap caller on the delegate listener (agents-mindmap posts
# external changes with it). It opens only POST /tasks/{key}/external-changes and is passed to the
# delegate component only. Comma separated, each different from the relay and delegate tokens.
# Needs the delegate component. Set at most one of mindmapTokens and mindmapExistingSecret.
mindmapTokens: ""
mindmapExistingSecret: ""
mindmapExistingSecretKey: tokens

# Source CIDRs allowed on the web listener. The oauth2-proxy sidecar (see components.web
# podAnnotations) reaches it from the pod loopback.
allowedCidrs:
  - 127.0.0.1/32

# Extra TASKBOARD_* settings; keys must start with TASKBOARD_.
env: {}

# web: user-facing api (admission by the oauth2-proxy pod annotations set here). service: the
# orchestrator relay api (bearer token). delegate: optional cluster-only user api (bearer token
# list, no ingress, no oauth2). notifier: singleton (one replica, Recreate).
components:
  web:
    replicas: 1
    port: 8000
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  service:
    replicas: 1
    port: 8002
    podAnnotations: {}
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 256Mi}
  delegate:
    replicas: 1
    port: 8003
    podAnnotations: {}
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {memory: 256Mi}
  notifier:
    podAnnotations: {}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}

podLabels: {}
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The api is routed under /taskboard on the shared host; only the web service is routed, the
# relay api stays in the cluster. The chart adds no cert-manager annotation: only one Ingress of
# the host carries it, the others reference the same TLS secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /taskboard
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
